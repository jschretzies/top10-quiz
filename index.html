/* ---------- Scoreboard ---------- */
let rowStep = 94;
function rankOf(scores){
  const idx = scores.map((_,i)=>i).sort((a,b)=>(scores[b]-scores[a]) || (a-b));
  const rank = {}; idx.forEach((p,k)=>{ rank[p] = (k>0 && scores[idx[k-1]]===scores[p]) ? rank[idx[k-1]] : k+1; });
  return {idx, rank};
}
const ranking = () => rankOf(S.scores);
function renderScoreboard(box, from, roundIdx){
  if(!NP()){ box.innerHTML = `<p class="empty-note">No players yet. Press 0, then → to reach “Who's playing?”.</p>`; return; }
  const {idx, rank} = ranking();
  const rp = roundIdx!=null ? roundPoints(roundIdx) : null;
  rowStep = Math.min(94, Math.floor(780/NP()));
  box.style.setProperty('--rowh', (rowStep-10)+'px');
  box.innerHTML = S.players.map((name,i)=>`
    <div class="sb-row" data-p="${i}">
      <div class="rk">${rank[i]}</div>
      <div class="nm">${esc(name)}${rp?`<span class="rp">${rp[i]>=0?'+':''}${rp[i]}</span>`:''}</div>
      <button type="button" data-d="-1" aria-label="${esc(name)} minus 1">−</button>
      <input type="number" inputmode="numeric" value="${S.scores[i]}" aria-label="Total score for ${esc(name)}">
      <button type="button" data-d="1" aria-label="${esc(name)} plus 1">+</button>
      <div class="mv"></div>
    </div>`).join('');
  box.style.height = (NP()*rowStep)+'px';
  if(Array.isArray(from) && from.length===NP()){
    from.forEach((p,k)=>{ const row = box.querySelector(`.sb-row[data-p="${p}"]`); if(row){ row.style.transition='none'; row.style.transform=`translateY(${k*rowStep}px)`; } });
    box.offsetHeight;
    box.querySelectorAll('.sb-row').forEach(r=>r.style.transition='');
    setTimeout(()=>positionRows(box, idx, rank, from), 450);
  } else positionRows(box, idx, rank, null);
  box.querySelectorAll('.sb-row').forEach(row=>{
    const p = +row.dataset.p, inp=row.querySelector('input');
    row.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
      setScore(box, p, (S.scores[p]||0) + (+b.dataset.d)*(e.shiftKey?5:1));
    }));
    inp.addEventListener('change',()=>setScore(box,p,inp.value));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); setScore(box,p,inp.value);
        const nxt = box.querySelector(`.sb-row[data-p="${(p+1)%NP()}"] input`); if(nxt){ nxt.focus({preventScroll:true}); nxt.select(); } }
    });
    inp.addEventListener('focus',()=>inp.select());
  });
}
function positionRows(box, idx, rank, before){
  idx.forEach((p,k)=>{
    const row = box.querySelector(`.sb-row[data-p="${p}"]`); if(!row) return;
    row.style.transform = `translateY(${k*rowStep}px)`;
    row.querySelector('.rk').textContent = rank[p];
    row.classList.toggle('first', rank[p]===1 && S.scores[p]>0);
    if(before){
      const up = before.indexOf(p) - k;
      if(up>0){
        row.classList.add('up'); row.querySelector('.mv').textContent = '▲ '+up;
        clearTimeout(row._t); row._t=setTimeout(()=>row.classList.remove('up'),3000);
      }
    }
  });
}
function setScore(box, p, v){
  const n = Math.round(Number(v));
  const before = ranking().idx;
  S.scores[p] = isNaN(n) ? 0 : n;
  save();
  const {idx, rank} = ranking();
  const inp = box.querySelector(`.sb-row[data-p="${p}"] input`); if(inp) inp.value = S.scores[p];
  positionRows(box, idx, rank, before);
}

/* ---------- Score readings, styled like a CGM app ---------- */
function snapshot(ri){
  S.history[ri] = S.scores.slice();
  const A = activeRounds(), pos = A.indexOf(ri);
  A.slice(pos+1).forEach(k=>{ delete S.history[k]; });
  save();
}
function prevScores(ri){
  const A = activeRounds();
  for(let k=A.indexOf(ri)-1;k>=0;k--) if(Array.isArray(S.history[A[k]])) return S.history[A[k]];
  return null;
}
function trend(gain, avg){
  const ratio = avg>0 ? gain/avg : (gain>0 ? 2 : (gain<0 ? -1 : 1));
  if(ratio>=2)   return {deg:-90, dbl:true,  word:'way above avg'};
  if(ratio>=1.4) return {deg:-90, dbl:false, word:'above avg'};
  if(ratio>=1.1) return {deg:-45, dbl:false, word:'just above avg'};
  if(ratio>=0.9) return {deg:0,   dbl:false, word:'average'};
  if(ratio>=0.6) return {deg:45,  dbl:false, word:'just below avg'};
  if(ratio>=0.25)return {deg:90,  dbl:false, word:'below avg'};
  return {deg:90, dbl:true, word:'way below avg'};
}
function renderCGM(ri){
  const n = NP();
  if(!n) return topbar() + `<p class="empty-note">No players yet.</p>`;
  const now = S.scores, prevRaw = prevScores(ri), prev = prevRaw || fit([],0);
  const gains = now.map((v,i)=>v-(prev[i]||0));
  const avg = gains.reduce((a,b)=>a+b,0)/n;
  const sorted = now.slice().sort((a,b)=>a-b);
  const hi = sorted[n-1], lo = sorted[0];
  const q = p => sorted[Math.round(p*(n-1))];
  const bandLo = q(.25), bandHi = q(.75);
  const A = activeRounds(), pos = A.indexOf(ri);
  const allVals = [].concat(...A.map(k=>S.history[k]).filter(Array.isArray), now);
  const ymax = Math.max(10, Math.ceil(Math.max(...allVals)*1.15/10)*10);
  const ymin = Math.min(0, Math.floor(Math.min(...allVals)/5)*5);
  const X0=26, X1=300, Y0=10, Y1=104;
  const xs = k => X0 + (X1-X0)*(k/Math.max(1,A.length-1));
  const ys = v => Y1 - (Y1-Y0)*((v-ymin)/(ymax-ymin));
  const spread = hi!==lo;
  const font = 'Outfit, Segoe UI, sans-serif';
  const cur = rankOf(now), old = prevRaw ? rankOf(prevRaw) : null;
  const tiedAt = rk => cur.idx.filter(p=>cur.rank[p]===rk).length>1;
  const cards = cur.idx.map(i=>{
    const name = S.players[i];
    const t = trend(gains[i], avg);
    const isHi = spread && now[i]===hi, isLo = spread && now[i]===lo;
    const pts = [];
    for(let k=0;k<=pos;k++){ const h = k===pos ? now : S.history[A[k]]; if(Array.isArray(h)) pts.push([xs(k), ys(h[i]), k===pos]); }
    const dots = pts.map(([x,y,last])=> last
      ? `<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="#15171F" stroke-width="3.5"/>`
      : `<circle cx="${x}" cy="${y}" r="5" fill="#15171F"/>`).join('');
    const axisLbl = v=>`<line x1="${X1+6}" x2="${X1+14}" y1="${ys(v)}" y2="${ys(v)}" stroke="#9AA0AC" stroke-width="2"/><text x="${X1+20}" y="${ys(v)+7}" font-size="20" fill="#15171F" font-family="${font}">${v}</text>`;
    const ticks = A.map((_,k)=>`<text x="${xs(k)}" y="134" font-size="18" text-anchor="middle" fill="${k===pos?'#15171F':'#5B6475'}" font-weight="${k===pos?700:400}" font-family="${font}">${k===pos?'Now':'R'+(k+1)}</text>`).join('');
    const svg = `<svg viewBox="0 0 380 140" role="img" aria-label="${esc(name)}: score per round">
      <rect x="${X0}" y="${ys(bandHi)}" width="${X1-X0}" height="${Math.max(4, ys(bandLo)-ys(bandHi))}" fill="#ECECEF"/>
      ${spread?`<line x1="${X0}" x2="${X1}" y1="${ys(hi)}" y2="${ys(hi)}" stroke="#F2C230" stroke-width="3"/>${axisLbl(hi)}`:''}
      ${spread?`<line x1="${X0}" x2="${X1}" y1="${ys(lo)}" y2="${ys(lo)}" stroke="#E5484D" stroke-width="3"/>${axisLbl(lo)}`:''}
      <line x1="${X0}" x2="${X1}" y1="${Y1+8}" y2="${Y1+8}" stroke="#9AA0AC" stroke-width="2"/>
      ${dots}${ticks}</svg>`;
    const move = old ? (()=>{ const d = old.rank[i]-cur.rank[i]; return d>0 ? `<span class="tag up">▲ ${d}</span>` : d<0 ? `<span class="tag down">▼ ${-d}</span>` : '<span class="tag same">=</span>'; })() : '';
    return `<div class="reading">${move}
      <div class="who"><span class="place ${cur.rank[i]===1?'p1':''}">${tiedAt(cur.rank[i])?'=':''}${cur.rank[i]}</span><span class="nm">${esc(name)}</span></div>
      <div class="dx ${isHi?'hi':''} ${isLo?'lo':''}" title="${t.word}">
        <div class="arrow" style="transform:rotate(${t.deg}deg)"><span class="tri"></span>${t.dbl?'<span class="tri t2"></span>':''}</div>
        <div class="disc"><div class="val">${now[i]}</div><div class="unit">${Math.abs(now[i])===1?'point':'points'}</div></div>
      </div>
      <div class="gain"><b>${gains[i]>=0?'+':''}${gains[i]}</b> this round: ${t.word}</div>
      ${svg}
    </div>`;
  }).join('');
  const cols = n>8 ? 5 : 4;
  return `<div class="cgm"><div class="cgm-head"><h2>Score readings after round ${rno(ri)}</h2><p>Ranked first to last. Arrow: this round vs the group average (+${Math.round(avg*10)/10})</p></div>
    <div class="cgm-grid" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div>
    <div class="cgm-foot">▲▼ places moved since last round. Grey band: the middle of the group. Yellow line: the leader. Red line: the lowest score.</div></div>`;
}

/* ---------- Winner ---------- */
function renderWinner(){
  if(!NP()) return topbar() + `<p class="empty-note">No players yet.</p>`;
  const {idx} = ranking();
  const top = idx.slice(0,3);
  const order = [top[1], top[0], top[2]];
  const cls = ['p2','p1','p3'], med=['🥈','🥇','🥉'];
  return topbar() + `<h2 class="headline">And the winner is…</h2><div class="podium">${order.map((p,k)=> p==null?'<div></div>':`
    <div class="pod ${cls[k]}"><div class="e">${med[k]}</div><div class="nm">${esc(S.players[p])}</div><div class="block">${S.scores[p]}</div></div>`).join('')}</div>`;
}

/* ---------- Overlays ---------- */
function openOverlay(id){
  ['sbOverlay','settings','help'].forEach(o=>{ if(o!==id) $('#'+o).classList.remove('show'); });
  const el=$('#'+id);
  if(el.classList.contains('show')){ closeOverlays(); return; }
  if(steps[S.step].kind==='players') commitPlayers(playerFieldValues());
  if(id==='help') el.innerHTML = helpHTML();
  if(id==='sbOverlay'){ el.innerHTML = `<div class="screen">${topbar()}<h2 class="headline">Scoreboard</h2><p class="sb-tip">Esc closes.</p><div class="sb" id="sbOv"></div></div>`; renderScoreboard($('#sbOv')); }
  if(id==='settings') renderSettings(el);
  el.classList.add('show');
  const f = el.querySelector('input,button'); if(f && id!=='help') f.focus();
}
function closeOverlays(){
  ['sbOverlay','settings','help'].forEach(o=>$('#'+o).classList.remove('show'));
  if(document.activeElement) document.activeElement.blur();
  render();
}
function anyOverlay(){ return ['sbOverlay','settings','help'].some(o=>$('#'+o).classList.contains('show')); }

function helpHTML(){
  const k = [
    ['→  or  Space','Next screen / flip the next tile'],['←','Back / hide the last tile'],
    ['T','Start or pause the timer'],['R','Reset the timer'],
    ['C','3, 2, 1, send! (any time)'],['S','Scoreboard'],
    ['Ctrl+Enter','Paste screen: add the points'],['I','Settings: lists, finale, answers'],
    ['1 – 9','Jump to a round'],['0','Back to the title'],
    ['X','Board: show or hide the explanation'],['F','Full screen'],
    ['Esc','Close, or leave a text field'],
  ];
  return `<div class="panel"><button class="btn close" type="button" data-close>Close (Esc)</button><h2>Shortcuts</h2>
  <p class="sub">After each board: paste the chat, check the points, Ctrl+Enter. After the last list of a round comes the scoreboard; Space shows the score readings.</p>
  <div class="keys">${k.map(([a,b])=>`<div><kbd>${a}</kbd><span>${b}</span></div>`).join('')}</div></div>`;
}

function estimate(){
  const R = activeRounds();
  const lists = R.reduce((a,ri)=>a+activeLists(ri).length,0);
  return {lists, rounds:R.length, min: lists*MIN_PER_LIST + R.length*MIN_PER_ROUND};
}
function renderSettings(el){
  const est = estimate();
  const qs = FIN ? FIN.questions : [];
  const fsel = S.finaleQs||[];
  el.innerHTML = `<div class="panel">
    <button class="btn close" type="button" data-close>Close (Esc)</button>
    <h2>Host settings</h2>
    <p class="sub">Saved automatically in this browser. Fill this in before the meeting, and don't share your screen while you do. To add or remove players, use “Who's playing?” (press 0, then →).</p>
    <h3>Lists to play <span class="est">${est.lists} lists in ${est.rounds} rounds: about ${est.min} minutes</span></h3>
    <div class="rgroups">${ROUNDS.map((r,ri)=> (r.type==='finale'||r.type==='estimate') ? '' : `<div class="rgroup"><div class="rname">${r.icon||''} ${esc(r.format)}</div><div class="qlist">${roundLists(ri).map(L=>`<label><input type="checkbox" data-list="${esc(L.key)}" ${(S.off||[]).includes(L.key)?'':'checked'}> ${esc(L.topic)}</label>`).join('')}</div></div>`).join('')}</div>
    ${S.estQs.length?`<h3>Team stats <span class="est">your own numbers: they stay in this browser and never go online</span></h3>
    <table class="ans esttab"><thead><tr><th style="text-align:left">Question</th><th>Unit</th><th>Real answer</th></tr></thead><tbody>
    ${S.estQs.map((q,k)=>`<tr><td><input class="name estq" data-estq="${k}" value="${esc(q.text)}" placeholder="${k===0?'e.g. How many calls did we take on our busiest day this year?':'Question '+(k+1)+' (leave empty to skip)'}" aria-label="Team stats question ${k+1}"></td><td><input class="estu" data-estu="${k}" value="${esc(q.unit)}" placeholder="${k===0?'calls':''}" aria-label="Unit ${k+1}"></td><td><input class="esta" data-esta="${k}" value="${esc(q.answer)}" inputmode="decimal" placeholder="${k===0?'412':''}" aria-label="Real answer ${k+1}"></td></tr>`).join('')}
    </tbody></table>
    <div id="estBox">${estWarn()}</div>`:''}
    ${FIN?`<h3>Finale questions <span class="est">pick 1 to 3; each one is a list in the finale</span></h3>
    <div class="qlist">${qs.map((q,k)=>`<label><input type="checkbox" data-fq="${q.id}" ${fsel.includes(q.id)?'checked':''}> Q${k+1}. ${esc(q.text)}</label>`).join('')}</div>
    <h3>Players' answers</h3>
    ${NP()?`<table class="ans"><thead><tr><th style="text-align:left">Name</th>${qs.map((q,k)=>`<th class="${fsel.includes(q.id)?'sel':''}">Q${k+1}<br><span style="font-weight:600">${esc(q.unit||'')}</span></th>`).join('')}</tr></thead>
    <tbody>${S.players.map((n,i)=>`<tr><td><input class="name" data-name="${i}" value="${esc(n)}" aria-label="Name of player ${i+1}"></td>${qs.map((q,k)=>`<td><input type="number" data-q="${q.id}" data-i="${i}" value="${esc(S.answers[q.id][i])}" aria-label="${esc(n)}, Q${k+1}"></td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="sub">No players yet.</p>'}
    <div id="tieBox">${tieAll()}</div>`:''}
    <div class="btns">
      ${FIN?'<button class="btn" type="button" data-act="toFinale">Go to the finale</button>':''}
      <button class="btn danger" type="button" data-act="resetScores">Reset scores</button>
      <button class="btn danger" type="button" data-act="resetAll">Reset everything</button>
    </div></div>`;
  const keepStep = fn => { const cur = steps[S.step]; fn(); buildSteps(); const same = steps.findIndex(st=>st.kind===cur.kind && st.r===cur.r && ((st.L&&st.L.key)||'')===((cur.L&&cur.L.key)||'')); S.step = same>=0 ? same : 0; S.revealed = 0; save(); };
  el.querySelectorAll('input[data-list]').forEach(x=>x.addEventListener('change',()=>{
    const key = x.dataset.list;
    const off = (S.off||[]).filter(k=>k!==key);
    if(!x.checked) off.push(key);
    keepStep(()=>{ S.off = off; });
    if(!rtot()){ keepStep(()=>{ S.off = off.filter(k=>k!==key); }); }
    renderSettings(el); const again = el.querySelector(`input[data-list="${key}"]`); if(again) again.focus();
  }));
  const estChange = (k, field, v) => { keepStep(()=>{ S.estQs[k][field] = v; }); const b=$('#estBox'); if(b) b.innerHTML = estWarn(); };
  el.querySelectorAll('input[data-estq]').forEach(x=>x.addEventListener('change',()=>{ estChange(+x.dataset.estq,'text',x.value.trim()); renderSettings(el); }));
  el.querySelectorAll('input[data-estu]').forEach(x=>x.addEventListener('change',()=>estChange(+x.dataset.estu,'unit',x.value.trim())));
  el.querySelectorAll('input[data-esta]').forEach(x=>x.addEventListener('change',()=>estChange(+x.dataset.esta,'answer',x.value.trim())));
  el.querySelectorAll('input[data-fq]').forEach(x=>x.addEventListener('change',()=>{
    let sel = (S.finaleQs||[]).filter(id=>id!==x.dataset.fq);
    if(x.checked) sel.push(x.dataset.fq);
    sel = FIN.questions.map(q=>q.id).filter(id=>sel.includes(id));        // keep the form order
    if(!sel.length || sel.length>3){ x.checked = !x.checked; return; }
    keepStep(()=>{ S.finaleQs = sel; });
    renderSettings(el); const again = el.querySelector(`input[data-fq="${x.dataset.fq}"]`); if(again) again.focus();
  }));
  el.querySelectorAll('input[data-name]').forEach(x=>x.addEventListener('change',()=>{ const v=x.value.trim(); if(v){ S.players[+x.dataset.name]=v; save(); } else x.value=S.players[+x.dataset.name]; }));
  el.querySelectorAll('input[data-q]').forEach(x=>x.addEventListener('input',()=>{ S.answers[x.dataset.q][+x.dataset.i]=x.value; save(); const b=$('#tieBox'); if(b) b.innerHTML=tieAll(); }));
  el.querySelector('[data-act=resetScores]').addEventListener('click',e=>confirmClick(e.currentTarget, 'Click again: scores to 0', ()=>{ S.scores=fit([],0); S.history={}; S.applied={}; S.paste={}; save(); e.currentTarget.textContent='Scores reset'; }));
  el.querySelector('[data-act=resetAll]').addEventListener('click',e=>confirmClick(e.currentTarget, 'Click again: reset everything', ()=>{ S=defaults(); syncArrays(); buildSteps(); save(); renderSettings(el); }));
  const tf = el.querySelector('[data-act=toFinale]');
  if(tf) tf.addEventListener('click',()=>{ const k=steps.findIndex(s=>s.kind==='intro'&&s.r===FINR); closeOverlays(); if(k>=0) go(k); });
}
function estWarn(){
  const qs = (S.estQs||[]).filter(q=>String(q.text||'').trim());
  if(!qs.length) return '<div class="warn">No team stats questions yet, so this round is skipped. Type at least one question and its real answer.</div>';
  const missing = qs.filter(q=>parseNumber(q.answer)==null);
  if(missing.length) return `<div class="warn">No real answer (a number) for: ${esc(missing.map(q=>q.text).join(' / '))}.</div>`;
  return `<div class="ok">✅ ${qs.length} question${qs.length>1?'s':''} ready.</div>`;
}
function tieAll(){
  return (S.finaleQs||[]).map(id=>{
    const q = finaleQ(id); const l = finaleRanking(id); const t = l.filter(x=>x.tied); const missing = NP()-l.length;
    let h = '';
    if(missing>0) h += `<div class="warn">“${esc(q.text)}”: ${missing} player${missing>1?'s have':' has'} no answer yet. They won't appear in this list.</div>`;
    if(t.length) h += `<div class="warn">“${esc(q.text)}”: tie between ${esc(t.map(x=>x.name+' ('+fmtNum(x.v)+')').join(', '))}. Tied players share the place, and either order counts as correct.</div>`;
    if(!h && NP()) h = `<div class="ok">✅ “${esc(q.text)}”: all ${NP()} answers in, no ties.</div>`;
    return h;
  }).join('');
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeOverlays(); });

/* ---------- Navigation ---------- */
function go(i, revealed){
  const prev = steps[S.step];
  if(prev.kind==='players' && screen.querySelector('input[data-slot]')) commitPlayers(playerFieldValues());
  S.step = Math.max(0, Math.min(steps.length-1, i));
  S.revealed = revealed||0;
  if(prev.kind==='timer' && steps[S.step].kind!=='timer') stopTimer();
  save(); render();
}
function next(){
  const st=steps[S.step];
  if($('#explainBox').classList.contains('show')){ $('#explainBox').classList.remove('show'); return; }
  if(st.kind==='board' && S.revealed < maxRevealAt(S.step)){ S.revealed++; save(); applyReveal(true); return; }
  if(st.kind==='paste'){ applyList(st.L); return; }
  if(st.kind==='scores' && S.revealed===0){ S.revealed=1; save(); render(); return; }
  go(S.step+1);
}
function back(){
  const st=steps[S.step];
  if(st.kind==='board' && S.revealed>0){ S.revealed--; save(); applyReveal(true); return; }
  if(st.kind==='scores' && S.revealed>0){ S.revealed=0; save(); render(); return; }
  const target = S.step-1;
  if(target>=0 && steps[target].kind==='board') go(target, maxRevealAt(target));
  else if(target>=0 && steps[target].kind==='scores') go(target, 1);
  else go(target);
}
function jumpRound(n){ const ri = activeRounds()[n-1]; const k=steps.findIndex(s=>s.kind==='intro'&&s.r===ri); if(k>=0) go(k); }

document.addEventListener('keydown',e=>{
  const st = steps[S.step];
  if((e.ctrlKey||e.metaKey) && e.key==='Enter' && !anyOverlay()){
    if(st.kind==='paste'){ e.preventDefault(); applyList(st.L); return; }
    if(st.kind==='players'){ e.preventDefault(); if(commitPlayers(playerFieldValues())) go(S.step+1); return; }
  }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'){
    if(cdBusy){ endCountdown(); return; }
    if(anyOverlay()){ e.preventDefault(); closeOverlays(); return; }
    if(typing){ e.target.blur(); }
    return;
  }
  if(typing) return;
  if(cdBusy) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if(k==='h'||k==='?'){ e.preventDefault(); openOverlay('help'); return; }
  if(k==='i'){ e.preventDefault(); openOverlay('settings'); return; }
  if(k==='s'){ e.preventDefault(); if(st.kind==='scores' && !anyOverlay()) return; openOverlay('sbOverlay'); return; }
  if(k==='f'){ e.preventDefault(); if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); return; }
  if(anyOverlay()) return;
  if(k===' '||k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); next(); return; }
  if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); back(); return; }
  if(k==='t'){ e.preventDefault(); toggleTimer(); return; }
  if(k==='r'){ e.preventDefault(); resetTimer(); return; }
  if(k==='c'){ e.preventDefault(); countdown(); return; }
  if(k==='x'){ e.preventDefault(); toggleExplain(); return; }
  if(k==='0'){ go(0); return; }
  if(/^[1-9]$/.test(k) && +k<=rtot()){ jumpRound(+k); return; }
});

// Test hook (used only for checking the scoring; harmless in the meeting).
window.__quiz = { parseChat, matchItem: (key,g)=>matchItem(findList(key),g), scoreRound: key=>scoreRound(findList(key)), lists: ()=>allLists().map(L=>L.key), state: ()=>S, steps: ()=>steps };

render();
})();
</script>
